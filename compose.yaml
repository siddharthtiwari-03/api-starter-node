

services:
  server-local:
    profiles: [local]
    build:
      context: .
      target: development
    container_name: server-local
    command: ["npm","run","local"]
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PORT: 5800
    ports:
      - 5800:5800
    develop:
      watch:
        - path: .
          action: sync
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - .vscode/
        - path: package.json
          action: rebuild
