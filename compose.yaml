  server-dev:
    profiles: ['dev']
    build:
      context: .
      target: development
    container_name: server-dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PORT: 5800
    ports:
      - 5800:5800

  server-prod:
    profiles: ['prod']
    build:
      context: .
      target: production
    container_name: server-prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 5800
    ports:
      - 5800:5800

